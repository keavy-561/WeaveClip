<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CutPilot - Projects</title>
<!-- Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Morandi Minimal Theme -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            surface: '#faf9f5',
            'surface-dim': '#dbdad6',
            'surface-bright': '#faf9f5',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f4f4f0',
            'surface-container': '#efeee9',
            'surface-container-high': '#e9e8e4',
            'surface-container-highest': '#e3e2de',
            primary: '#516172',
            'on-primary': '#ffffff',
            'primary-container': '#d4e4f8',
            'on-primary-container': '#0c1d2d',
            secondary: '#585e65',
            'on-secondary': '#ffffff',
            'secondary-container': '#dbe3eb',
            'on-secondary-container': '#151b21',
            outline: '#75777a',
            'outline-variant': '#c5c6c9',
            'on-surface': '#1b1b1d',
            'on-surface-variant': '#454649',
          },
          borderRadius: {
            'md': '0.5rem',
            'lg': '0.75rem',
          },
          boxShadow: {
            'sm': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            DEFAULT: '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
            'md': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styles">
    body {
      background-color: theme('colors.surface');
      color: theme('colors.on-surface');
    }
  </style>
</head>
<body class="min-h-screen antialiased flex flex-col">
<!-- BEGIN: Header -->
<header class="bg-surface-container-lowest border-b border-outline-variant h-16 flex items-center px-4 md:px-8 shrink-0 relative" data-purpose="app-header">
<div class="flex items-center gap-4">
<!-- Back Button -->
<button aria-label="Go back" class="p-2 text-on-surface hover:bg-surface-container rounded-full transition-colors">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<line x1="19" x2="5" y1="12" y2="12"></line>
<polyline points="12 19 5 12 12 5"></polyline>
</svg>
</button>
<!-- Logo -->
<div class="flex items-center gap-2">
<div class="bg-primary text-on-primary w-8 h-8 rounded-md flex items-center justify-center font-bold text-lg leading-none">
          CP
        </div>
<span class="font-bold text-xl tracking-tight text-on-surface">CutPilot</span>
</div>
</div>
<!-- Center Title -->
<div class="absolute left-1/2 transform -translate-x-1/2">
<h1 class="font-bold text-lg text-on-surface">项目</h1>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-12 flex flex-col gap-8" data-purpose="main-content">
<!-- Action Bar -->
<div class="flex justify-end w-full">
<button class="bg-primary hover:bg-primary/90 text-on-primary px-6 py-2.5 rounded-md font-semibold flex items-center gap-2 shadow-sm transition-colors text-sm" data-purpose="new-video-btn">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
        新视频
      </button>
</div>
<!-- Project Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" data-purpose="project-grid">
<!-- Card 1 -->
<article class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-[180px]" data-purpose="project-card">
<div class="p-6 flex-1 flex flex-col justify-center">
<h2 class="text-xl font-bold text-on-surface mb-2">纽约旅行Vlog</h2>
</div>
<div class="px-6 py-4 border-t border-outline-variant/50 bg-surface-container-lowest flex items-center justify-between text-sm text-on-surface-variant">
<div class="flex items-center gap-3">
<span>9:16</span>
<span>45秒</span>
<span>精力充沛</span>
</div>
<span class="text-on-surface">准备好</span>
</div>
</article>
<!-- Card 2 -->
<article class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-[180px]" data-purpose="project-card">
<div class="p-6 flex-1 flex flex-col justify-center">
<h2 class="text-xl font-bold text-on-surface mb-2">产品预告</h2>
</div>
<div class="px-6 py-4 border-t border-outline-variant/50 bg-surface-container-lowest flex items-center justify-between text-sm text-on-surface-variant">
<div class="flex items-center gap-3">
<span>16:9</span>
<span>30年代</span>
<span>电影</span>
</div>
<span class="text-on-surface">草稿</span>
</div>
</article>
<!-- Card 3 -->
<article class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-[180px]" data-purpose="project-card">
<div class="p-6 flex-1 flex flex-col justify-center">
<h2 class="text-xl font-bold text-on-surface mb-2">海滩日录像</h2>
</div>
<div class="px-6 py-4 border-t border-outline-variant/50 bg-surface-container-lowest flex items-center justify-between text-sm text-on-surface-variant">
<div class="flex items-center gap-3">
<span>9:16</span>
<span>60年代</span>
<span>最低限度</span>
</div>
<span class="text-on-surface">准备好</span>
</div>
</article>
</div>
</main>
<!-- END: Main Content -->
</body></html>
