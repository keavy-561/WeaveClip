name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weaveclip
          POSTGRES_PASSWORD: weaveclip_dev
          POSTGRES_DB: weaveclip
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U weaveclip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Download server deps
        working-directory: server
        run: go mod download
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test with coverage
        working-directory: server
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: weaveclip
          DATABASE_PASSWORD: weaveclip_dev
          DATABASE_DBNAME: weaveclip
          DATABASE_SSLMODE: disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: test_secret
          MOCK_MODE: false
        run: go test -race ./internal/handler ./internal/middleware ./tests/...
      - name: Build
        working-directory: server
        run: go build -o bin/server ./cmd/server
      - name: Smoke tests
        working-directory: server
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: weaveclip
          DATABASE_PASSWORD: weaveclip_dev
          DATABASE_DBNAME: weaveclip
          DATABASE_SSLMODE: disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: test_secret
          MOCK_MODE: false
        run: |
          set -euo pipefail
          ./bin/server &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          bash tests/smoke/health.sh
          bash tests/smoke/auth.sh
          bash tests/smoke/assets.sh
          kill "$SERVER_PID" || true
          wait "$SERVER_PID" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: web
        run: pnpm test:run
      - name: Build
        working-directory: web
        run: pnpm build
      - name: i18n check
        working-directory: web
        run: pnpm run check:i18n

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Lint backend
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server
          version: latest
      - name: Lint frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec eslint src --ext .ts,.tsx || echo "ESLint not configured, skipping"
