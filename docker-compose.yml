services:
  postgres:
    image: postgres:16
    container_name: weaveclip-postgres
    environment:
      POSTGRES_USER: weaveclip
      POSTGRES_PASSWORD: weaveclip_dev
      POSTGRES_DB: weaveclip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaveclip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weaveclip-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: weaveclip-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 应用服务（工单 WO11-02）。生产部署请配置 MinIO 的 STORAGE_* 环境变量
  # （见 server/config/prod.yaml）并启用 nginx TLS；本地磁盘回落仅限开发。
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    container_name: weaveclip-server
    environment:
      APP_ENV: dev
      MOCK_MODE: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: weaveclip
      DATABASE_PASSWORD: weaveclip_dev
      DATABASE_DBNAME: weaveclip
      DATABASE_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: change_me_in_production
      MOCK_STORAGE_DIR: /data/mock-storage
    volumes:
      - mockstorage:/data/mock-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    container_name: weaveclip-worker
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      APP_ENV: dev
      MOCK_MODE: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: weaveclip
      DATABASE_PASSWORD: weaveclip_dev
      DATABASE_DBNAME: weaveclip
      DATABASE_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: change_me_in_production
      MOCK_STORAGE_DIR: /data/mock-storage
    volumes:
      - mockstorage:/data/mock-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: weaveclip-web
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
  miniodata:
  mockstorage:
